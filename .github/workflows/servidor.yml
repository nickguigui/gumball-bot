name: Gumball Servidor

# Servidor de TODOS os numeros (quem conecta pelo site). Roda ~5h40, salva os dados
# criptografados no ramo estado a cada 1 min e dispara a proxima execucao.
# O site acha o servidor pelo endereco do tunel publicado em endpoint.json.
on:
  schedule:
    - cron: '23 */2 * * *' # so religa a corrente se ela cair
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gumball-servidor
  cancel-in-progress: false

jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Restaurar dados
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          STATE_FILE: ${{ runner.temp }}/servidor.enc
          STATE_DIRS: ./data
        run: |
          # dados ficam no ramo "estado" (um unico commit sobrescrito: o historico nao incha)
          if git fetch -q --depth=1 origin estado 2>/dev/null; then git show FETCH_HEAD:servidor.enc > "$STATE_FILE"; echo "📦 dados do ramo estado"; else cp state/servidor.enc "$STATE_FILE"; echo "📦 dados antigos do main"; fi
          node scripts/state.mjs unpack

      - name: Rodar o servidor
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          STATE_FILE: ${{ runner.temp }}/servidor.enc
          STATE_DIRS: ./data
          DATA_ROOT: ./data/tenants
          PORT: '8787'
          ALLOWED_ORIGINS: https://nickguigui.github.io
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BOT_NAME: ${{ vars.BOT_NAME || 'GUMBALL' }}
          OWNER_NAME: ${{ vars.OWNER_NAME || 'Nick' }}
          BLOCKED_COMMANDS: ${{ vars.BLOCKED_COMMANDS || 'face' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SPICY_LYRICS_KEY: ${{ secrets.SPICY_LYRICS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GPT_PERSONA: ${{ vars.GPT_PERSONA }}
          TENOR_API_KEY: ${{ secrets.TENOR_API_KEY }}
          REMOVEBG_API_KEY: ${{ secrets.REMOVEBG_API_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e  # erros tratados um a um (um kill de processo ja morto nao pode derrubar o servidor)
          git config user.name "gumball-servidor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publicar() { # $1 = arquivos, $2 = mensagem
            git add $1; git diff --cached --quiet && return 0
            git commit -q -m "$2"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && return 0; sleep 3; done
            echo "⚠️ push falhou"
          }
          # salva a sessao a cada minuto no ramo "estado" (force push de um commit so, sem historico)
          salvar() {
            node scripts/state.mjs pack >/dev/null || return 1
            local b t c; b=$(git hash-object -w "$STATE_FILE"); t=$(printf '100644 blob %s\tservidor.enc\n' "$b" | git mktree)
            c=$(git commit-tree "$t" -m "servidor: dados $(date -u +%H:%M)") && git push -fq origin "$c:refs/heads/estado" || echo "⚠️ não salvei"
          }
          # cancelado (deploy novo) ou derrubado: para o bot e salva antes de sair
          trap 'kill -TERM $SRV 2>/dev/null; sleep 3; salvar; exit 0' INT TERM

          # ffmpeg + yt-dlp em paralelo (o servidor ja atende enquanto instala)
          ( for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-noto-color-emoji > /dev/null && break; echo "apt falhou ($i)"; sleep 20; done
            # reserva: ffmpeg pronto (estatico) se o apt nao instalou
            command -v ffmpeg >/dev/null || { curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/; }
            sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod +x /usr/local/bin/yt-dlp
            # o yt-dlp precisa de um interpretador JavaScript (Deno) para decifrar os links do YouTube
            curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip && sudo unzip -oq /tmp/deno.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/deno
            echo "ferramentas: ffmpeg=$(command -v ffmpeg) yt-dlp=$(command -v yt-dlp) deno=$(command -v deno)" ) > instalar.log 2>&1 &

          npm run server > servidor.log 2>&1 &
          SRV=$!

          # tunel gratis da Cloudflare (sem conta): da um endereco https publico para o site
          # (os IPs do Actions as vezes levam 429: tenta de novo e, se nao der, usa o localhost.run)
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared && chmod +x cloudflared
          URL=""
          for tentativa in 1 2 3 4 5; do
            ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 > tunel.log 2>&1 &
            TUN=$!
            for i in $(seq 40); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunel.log | head -1); [ -n "$URL" ] && break; kill -0 $TUN 2>/dev/null || break; sleep 1; done
            [ -n "$URL" ] && break
            echo "⚠️ túnel Cloudflare falhou (tentativa $tentativa): $(grep -m1 -oE 'status [0-9]+' tunel.log)"; kill $TUN 2>/dev/null; sleep $((tentativa*15))
          done
          if [ -z "$URL" ]; then
            echo "↪️ usando localhost.run"
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes -R 80:127.0.0.1:8787 nokey@localhost.run -- --output json > tunel2.log 2>&1 &
            for i in $(seq 40); do URL=$(grep -oE 'https://[a-z0-9.-]+\.(lhr\.life|localhost\.run)' tunel2.log | head -1); [ -n "$URL" ] && break; sleep 1; done
          fi
          [ -z "$URL" ] && { echo "❌ nenhum túnel subiu"; cat tunel.log tunel2.log 2>/dev/null | tail -20; exit 1; }
          echo "🌐 servidor em $URL"
          printf '{"url":"%s","desde":%s}\n' "$URL" "$(date +%s000)" > endpoint.json
          publicar endpoint.json "servidor: endereco"

          fim=$(( $(date +%s) + 340*60 ))
          while kill -0 $SRV 2>/dev/null && [ $(date +%s) -lt $fim ]; do
            for i in $(seq 6); do kill -0 $SRV 2>/dev/null || break; sleep 10; done
            salvar
            grep -E "ERR|erro|Error" servidor.log | tail -3 || true
          done
          printf '{"url":"","desde":%s,"trocando":true}\n' "$(date +%s000)" > endpoint.json
          publicar endpoint.json "servidor: trocando de turno"
          kill -TERM $SRV 2>/dev/null; sleep 6
          salvar
          echo "🔁 Disparando o próximo turno"
          gh workflow run servidor.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "⚠️ não consegui disparar o próximo"

      - name: Salvar ao cancelar
        if: cancelled() || failure()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          STATE_FILE: ${{ runner.temp }}/servidor.enc
          STATE_DIRS: ./data
        run: |
          pkill -TERM -f "src/manager.js" 2>/dev/null; sleep 3
          [ -d data/tenants ] || exit 0
          node scripts/state.mjs pack >/dev/null || exit 0
          git config user.name "gumball-servidor"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b=$(git hash-object -w "$STATE_FILE"); t=$(printf '100644 blob %s\tservidor.enc\n' "$b" | git mktree)
          c=$(git commit-tree "$t" -m "servidor: dados (cancelado)") && git push -fq origin "$c:refs/heads/estado" && echo "💾 salvo"
          # avisa o site que o servidor esta trocando (senao ele tenta o endereco antigo, ja morto)
          printf '{"url":"","desde":%s,"trocando":true}\n' "$(date +%s000)" > endpoint.json
          git add endpoint.json && git commit -qm "servidor: trocando de turno" && for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 2; done
          true
